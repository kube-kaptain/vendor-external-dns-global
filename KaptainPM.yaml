apiVersion: kaptain.org/1.29
kind: kubernetes-bundle-vendor-helm-rendered
metadata:
  description: "Vendored ExternalDNS CRD for cluster-wide installation"

spec:
  layers:
    - layerset-cluster-use-project:[1.1]
  main:
    vendorHelmRendered:
      repoUrl: 'https://kubernetes-sigs.github.io/external-dns/'
      chartName: 'external-dns'
      moveFiles:
        - source: 'crds/dnsendpoints.externaldns.k8s.io.yaml'
          destination: 'customresourcedefinition-dnsendpoints.yaml'
  global:
    release:
      versioning:
        maxParts: '4'
        strategy: file-pattern-match
        patternType: custom
        source:
          subPath: src/config
          fileName: VendorHelmRenderedVersion
          pattern: '^v?([0-9]+\.[0-9]+\.[0-9]+)$'
          prefixParts: '3'
